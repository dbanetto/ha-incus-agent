name: Incus Agent Diagnostics
version: "0.2.0"
slug: incus_agent
description: Read-only host diagnostics for Incus guest agent support
arch:
  - aarch64
  - amd64
startup: once
boot: manual
init: false
stage: experimental
host_pid: true
apparmor: false
privileged:
  - SYS_PTRACE
  - DAC_READ_SEARCH
  - SYS_ADMIN
options:
  mode: diagnose
schema:
  mode: list(diagnose|source_check)
