name: Incus Agent Diagnostics
version: "0.3.0"
slug: incus_agent
description: Diagnose Incus support or explicitly run the guest agent on HAOS
arch:
  - aarch64
  - amd64
startup: services
boot: manual
init: false
stage: experimental
host_pid: true
full_access: true
apparmor: false
timeout: 180
privileged:
  - SYS_PTRACE
  - DAC_READ_SEARCH
  - SYS_ADMIN
options:
  mode: diagnose
schema:
  mode: list(diagnose|source_check|manage)
